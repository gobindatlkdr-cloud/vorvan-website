name: Static website security and integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check assets/site.js && node --check assets/admin.js && node --check assets/assistant.js
      - name: Test authenticator QR rendering with synthetic SVG fixtures
        run: node scripts/test_mfa_qr.cjs
      - name: Validate static website security and local links
        run: python3 scripts/check_site.py
      - name: Install Deno for backend type checking
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check authenticated AI guidance backend
        run: deno check backend/ai-guidance/index.ts backend/admin-console/index.ts backend/site-assistant/index.ts backend/admin-mfa-recovery/index.ts
