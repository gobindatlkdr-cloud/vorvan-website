name: Static website security and integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check assets/site.js && node --check assets/admin.js && node --check assets/assistant.js && node --check assets/institutional-inquiry.js
      - name: Registered-company publication, multilingual dynamic copy and secure demo entry points
        run: node scripts/test_registered_company_publication.cjs
      - name: CIBIL-first marketing, verified customer contact RLS and owner enquiry queue regression
        run: node scripts/test_cibil_first_publication.cjs
      - name: Applicant mobile OTP gate and conditional-profile security regression
        run: node scripts/test_applicant_phone_flow.cjs
      - name: Verify synthetic applicant form visual preview is strictly read-only
        run: node scripts/test_applicant_preview.cjs
      - name: Check live SEO audit script syntax
        run: python3 -m py_compile scripts/audit_live_seo.py
      - name: Test authenticator QR rendering with synthetic SVG fixtures
        run: node scripts/test_mfa_qr.cjs
      - name: Test Vyn name and animated hand-wave and live FAQ handoff (synthetic DOM)
        run: node scripts/test_bian.cjs
      - name: Test approved Vyn homepage prompt bar and clockwise antenna
        run: node scripts/test_home_vyn.cjs
      - name: Check company vault, incorporation disclosure and MFA security
        run: node scripts/test_company_vault.cjs
      - name: Verify contextual customer and partner experience
        run: node scripts/test_partner_loans_ui.cjs
      - name: Verify M0 security baseline and Vyn channel separation
        run: node scripts/test_m0_security_baseline.cjs
      - name: Verify frozen M0 baseline manifest and rollback safeguards
        run: node scripts/test_m0_vor001_baseline.cjs
      - name: Verify VOR-004 Data API privilege migration and threat review
        run: node scripts/test_m0_vor004_security.cjs
      - name: Validate static website security and local links
        run: python3 scripts/check_site.py
      - name: Install Deno for backend type checking
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Owner-only live customer profile roster AAL2, separate enquiries and minimisation tests
        run: deno test --allow-read backend/tests/customer_owner_profile_roster.test.ts
      - name: Test bounded Vault request streams
        run: deno test backend/compliance-vault/body-limit.test.ts
      - name: Run VOR-002 synthetic MFA, role and permission integration tests
        run: deno test --allow-env backend/tests/admin_role_gates.test.ts
      - name: Run VOR-003 synthetic document Vault workflow tests
        run: deno test --allow-env backend/tests/company_vault_workflow.test.ts
      - name: Run VOR-005 Vyn trilingual and safety API tests
        run: deno test backend/tests/site_assistant_multilingual.test.ts
      - name: Run VOR-005 Vyn multilingual UI and offline-fallback tests
        run: node scripts/test_vyn_multilingual_ui.cjs
      - name: M1 VOR-006 Customer Auth & Versioned Consent — disabled by default
        run: deno test --allow-env backend/tests/customer_identity_disabled.test.ts
      - name: M1 VOR-006 Customer Auth & Consent — synthetic integration
        run: deno test --allow-env backend/tests/customer_identity_consent.test.ts
      - name: Type-check sandbox Customer Identity backend and consent notice registry
        run: deno check backend/customer-identity/index.ts backend/customer-identity/notices.ts
      - name: Run VOR-007 explainable questionnaire synthetic scenario tests
        run: deno test backend/tests/readiness_rules.test.ts
      - name: Type-check VOR-007 rules, definitions and synthetic-only examples
        run: deno check backend/readiness/questions.ts backend/readiness/engine.ts backend/readiness/demo.ts
      - name: Verify VOR-007 three-category readiness demo has no live score or approval
        run: |
          set -euo pipefail
          deno run backend/readiness/demo.ts > /tmp/vor007-readiness-results.jsonl
          python3 - <<'PY'
          import json
          with open("/tmp/vor007-readiness-results.jsonl", encoding="utf-8") as f:
              rows=[json.loads(line) for line in f if line.strip()]
          assert {r["category"] for r in rows}=={"personal","business","education"}
          assert all(r["cibil_score"] is None and not r["eligibility_assessed"] and not r["financial_offer_available"] and not r["personal_data_stored"] for r in rows)
          assert all(r["total"]==6 and len(r["question_ids"])==6 for r in rows)
          print("PASS VOR-007: 3 simulated categories, 6 questions each, no live scoring, approval or PII")
          PY
      - name: VOR-008 browser rules generated from exact VOR-007 source
        run: |
          node scripts/build_readiness_browser.cjs --check
          node --check assets/readiness-questions.js
          node --check assets/readiness-engine.js
          node --check assets/readiness-controller.js
          node --check assets/readiness-passport.js
      - name: VOR-008 exhaustive browser/TypeScript parity (6561 cases)
        run: deno test backend/tests/readiness_browser_parity.test.ts
      - name: VOR-008 real Passport UI synthetic DOM, languages, no-PII tests
        run: deno test --allow-read backend/tests/readiness_passport_ui.test.ts
      - name: VOR-009 90-day synthetic educational action plan engine tests
        run: deno test backend/tests/readiness_action_plan.test.ts
      - name: Verify VOR-009 browser action plan syntax and privacy-safe DOM
        run: |
          node --check assets/readiness-action-plan.js
          node --check assets/readiness-passport.js
          deno check assets/readiness-action-plan.js
      - name: VOR-010 role-scoped readiness queues, immutable release gates, and synthetic task transitions
        run: deno test backend/tests/admin_readiness_sandbox.test.ts
      - name: VOR-010 actual admin UI synthetic DOM and server MFA/ACL mount regression
        run: deno test --allow-read backend/tests/admin_readiness_ui.test.ts
      - name: Verify VOR-010 browser module syntax and type checking
        run: |
          node --check assets/admin-readiness-sandbox.js
          node --check assets/admin.js
          deno check assets/admin-readiness-sandbox.js
      - name: VOR-011 public institutional form retry and privacy-safe UX
        run: node scripts/test_institutional_form_retry.cjs
      - name: VOR-011 real institutional Edge handler intake/role/audit/retry integration
        run: deno test --allow-env backend/tests/institutional_inquiry_workflow.test.ts
      - name: VOR-012 regenerate exact VOR-006 synthetic Coach notices and validate source
        run: |
          node scripts/build_vyn_coach_notices.cjs --check
          node --check assets/vyn-coach-engine.js
          node --check assets/vyn-coach-notices.js
          node --check assets/vyn-coach-ui.js
          node --check scripts/build_vyn_coach_notices.cjs
      - name: VOR-012 consent-gated Vyn educational Coach multilingual safety and redaction tests
        run: deno test backend/tests/vyn_coach_safety.test.ts
      - name: VOR-012 actual sandbox Coach browser UI synthetic DOM tests
        run: deno test --allow-read backend/tests/vyn_coach_ui.test.ts
      - name: VOR-012 coach runtime and UI type-check
        run: deno check assets/vyn-coach-engine.js assets/vyn-coach-ui.js
      - name: VOR-013 support and complaints synthetic SLA, RBAC, escalation and audit tests
        run: deno test backend/tests/support_lifecycle_sandbox.test.ts
      - name: VOR-013 actual Admin Support UI and session-gate synthetic DOM tests
        run: deno test --allow-read backend/tests/support_lifecycle_ui.test.ts
      - name: VOR-013 support engine/UI static checks
        run: |
          node --check assets/support-lifecycle-sandbox.js
          node --check assets/support-lifecycle-ui.js
          deno check assets/support-lifecycle-sandbox.js assets/support-lifecycle-ui.js
      - name: VOR-014 fictional version registry, policy flags, aggregates and immutable release gates
        run: deno test backend/tests/ai_governance_sandbox.test.ts
      - name: VOR-014 actual role-scoped Admin Governance UI synthetic DOM tests
        run: deno test --allow-read backend/tests/ai_governance_ui.test.ts
      - name: VOR-014 governance source syntax and type checks
        run: |
          node --check assets/ai-governance-sandbox.js
          node --check assets/ai-governance-ui.js
          deno check assets/ai-governance-sandbox.js assets/ai-governance-ui.js
      - name: VOR-016 fictional identity and consent notice, rights workflows and no-PII tests
        run: deno test backend/tests/privacy_requests_sandbox.test.ts
      - name: VOR-016 actual Admin privacy queue and fictional export UI DOM tests
        run: deno test --allow-read backend/tests/privacy_requests_ui.test.ts
      - name: VOR-016 syntax, TypeScript checks and canonical notice registry parity
        run: |
          node --check assets/privacy-requests-sandbox.js
          node --check assets/privacy-requests-ui.js
          deno check assets/privacy-requests-sandbox.js assets/privacy-requests-ui.js
          node scripts/build_vyn_coach_notices.cjs --check
      - name: VOR-015 fixed subscription plans, simulated webhook idempotency, refund and audit tests
        run: deno test backend/tests/subscription_payment_sandbox.test.ts
      - name: VOR-015 actual role-scoped Admin payments and fictional refund UI DOM regression
        run: deno test --allow-read backend/tests/subscription_payment_ui.test.ts
      - name: VOR-015 payment engine and UI JS syntax and Deno type-check
        run: |
          node --check assets/subscription-payment-sandbox.js
          node --check assets/subscription-payment-ui.js
          deno check assets/subscription-payment-sandbox.js assets/subscription-payment-ui.js
      - name: VOR-018 lender/bureau offline contract, consent, RBAC, 422/503 retry and zero-data tests
        run: deno test backend/tests/lender_bureau_mock.test.ts
      - name: VOR-018 actual Admin adapter monitoring UI synthetic DOM and session gate tests
        run: deno test --allow-read backend/tests/lender_bureau_mock_ui.test.ts
      - name: VOR-018 lender/bureau offline engine and UI source checks
        run: |
          node --check assets/lender-bureau-mock.js
          node --check assets/lender-bureau-mock-ui.js
          deno check assets/lender-bureau-mock.js assets/lender-bureau-mock-ui.js
      - name: Customer login, fictional CIBIL Guide and real owner-scoped loan enquiry source tests
        run: deno test --allow-read backend/tests/customer_portal_journey.test.ts
      - name: Customer Auth portal and Admin operations source and type checks
        run: |
          node --check assets/customer-journey-engine.js
          node --check assets/customer-portal.js
          node --check assets/customer-admin-queue.js
          deno check assets/customer-journey-engine.js assets/customer-portal.js assets/customer-admin-queue.js backend/customer-operations/index.ts
      - name: Type-check authenticated AI guidance backend
        run: deno check backend/ai-guidance/index.ts backend/admin-console/index.ts backend/site-assistant/index.ts backend/admin-mfa-recovery/index.ts backend/compliance-vault/index.ts backend/institutional-inquiries/index.ts

  consent-rls-isolated-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic_only_not_a_real_secret
          POSTGRES_DB: vorvan_sandbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vorvan_sandbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Execute real PostgreSQL RLS tests in throwaway container
        env:
          PGPASSWORD: synthetic_only_not_a_real_secret
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y postgresql-client
          fi
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d vorvan_sandbox \
            -f backend/sandbox/vor006_rls_setup.sql \
            -f backend/sandbox/vor006_customer_consent_schema.sql \
            -f backend/sandbox/vor006_rls_tests.sql
          echo 'PASS: isolated VOR-006 Postgres RLS and append-only checks; no production Supabase access'
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d vorvan_sandbox \
            -f backend/sandbox/vor011_inquiry_fixture.sql \
            -f backend/migrations/vor011_atomic_inquiry_audit.sql \
            -f backend/sandbox/vor011_atomicity_tests.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d vorvan_sandbox \
            -f backend/sandbox/customer_intake_rls_setup.sql \
            -f backend/migrations/20261111_customer_contact_enquiry_rls.sql \
            -f backend/migrations/20261112_applicant_mobile_otp_profile.sql \
            -f backend/sandbox/customer_intake_rls_tests.sql
          echo 'PASS: isolated customer contact profile, auth owner RLS, enquiry and atomic staff audit'
          echo 'PASS: isolated VOR-011 atomic audit and retry-key tests; no production Supabase access'
