name: Live website URL verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check current live public site, routing and protected APIs
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://vorvan.co.in/"
          EDGE="https://kukfpsqujlutlgwndplh.supabase.co/functions/v1"
          html() { curl --fail --location --silent --show-error --max-time 25 "$BASE$1"; }
          code() { curl --location --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "$1"; }

          # GitHub Pages can publish shortly after main CI starts.
          site_ready=0
          for attempt in $(seq 1 12); do
            home=$(html "" || true)
            if grep -q 'id="loan-categories"' <<< "$home" &&
               grep -q 'Partner With Us' <<< "$home" &&
               grep -q 'VORVAN PRIVATE LIMITED' <<< "$home" &&
               ! grep -q 'Incorporation pending' <<< "$home"; then
              site_ready=1;break
            fi
            echo "Waiting for current live website release ($attempt/12)"
            sleep 5
          done
          [[ "$site_ready" == "1" ]] || { echo "FAIL: updated public homepage not live"; exit 1; }

          # Required user-facing and protected web assets.
          for path in assets/site.css assets/site.js assets/assistant.js assets/refresh.css assets/favicon.svg \
            assets/partner-portal.css assets/institutional-inquiry.js assets/institutional-inquiry.css \
            index.html solutions.html partners.html partner-desk.html experience.html \
            about.html contact.html privacy.html terms.html admin.html assets/admin.js assets/admin.css \
            sitemap.xml robots.txt google7decf5ca6ffe0331.html; do
            status=$(code "$BASE$path")
            echo "$path: HTTP $status"
            [[ "$status" == "200" ]] || exit 1
          done

          # The four categories must remain educational; company registration is not lending authorisation.
          solutions=$(html "solutions.html")
          for category in 'Personal Loan' 'Business Loan' 'Education Loan' 'Short-Term Loan'; do
            grep -q "$category" <<< "$home" || exit 1
            grep -q "$category" <<< "$solutions" || exit 1
          done
          grep -q 'No live loan, credit-bureau, KYC or payment services' <<< "$home" || exit 1
          grep -q 'class="vv-vyn-antenna-rotor"' <<< "$home" || exit 1
          grep -q 'data-vv-search-submit' <<< "$home" || exit 1

          # Contact paths are scoped: no internal Admin mailbox on public pages.
          contact=$(html "contact.html")
          partners=$(html "partners.html")
          privacy=$(html "privacy.html")
          grep -q 'info@vorvan.co.in' <<< "$contact" || exit 1
          grep -q 'support@vorvan.co.in' <<< "$contact" || exit 1
          grep -q 'partnerships@vorvan.co.in' <<< "$partners" || exit 1
          grep -q 'legal@vorvan.co.in' <<< "$privacy" || exit 1
          grep -q 'id="vv-institutional-inquiry-form"' <<< "$partners" || exit 1
          for page in "$home" "$contact" "$partners" "$privacy"; do
            if grep -q 'admin@vorvan.co.in' <<< "$page"; then
              echo "FAIL: internal Admin mailbox exposed on public page";exit 1
            fi
          done

          # Private staff route remains separate and cannot serve operations without a session.
          admin=$(html "admin.html")
          grep -q 'id="mfa-form"' <<< "$admin" || exit 1
          grep -q 'id="panel-nav"' <<< "$admin" || exit 1
          for url in "$EDGE/compliance-vault/" "$EDGE/admin-console/overview" "$EDGE/ai-guidance"; do
            status=$(code "$url")
            echo "Protected route $url HTTP $status"
            [[ "$status" == "401" ]] || exit 1
          done

          # Public Vyn response: correct institutional contact, no internal details.
          for lang in en bn hi; do
            response=$(curl --fail --silent --show-error --max-time 25 -X POST \
              -H 'Content-Type: application/json' -H 'Origin: https://vorvan.co.in' \
              -d "{\"language\":\"$lang\",\"topic\":\"contact\"}" "$EDGE/site-assistant")
            grep -q '"official_email":"info@vorvan.co.in"' <<< "$response" || exit 1
            if grep -q 'admin@vorvan.co.in\|official_emails' <<< "$response"; then
              echo "FAIL: Vyn leaked internal contact data";exit 1
            fi
          done
          p_response=$(curl --fail --silent --show-error --max-time 25 -X POST \
            -H 'Content-Type: application/json' -H 'Origin: https://vorvan.co.in' \
            -d '{"language":"en","topic":"partnership"}' "$EDGE/site-assistant")
          grep -q '"official_email":"partnerships@vorvan.co.in"' <<< "$p_response" || exit 1

          # Institutional intake rejects public reads and malformed submission.
          [[ "$(code "$EDGE/institutional-inquiries")" == "401" ]] || exit 1
          bad=$(curl --silent --show-error --max-time 20 -X POST \
            -H 'Origin: https://vorvan.co.in' -H 'Content-Type: application/json' \
            -d '{"institution_type":"nbfc","consent":false}' -o /dev/null -w '%{http_code}' "$EDGE/institutional-inquiries")
          [[ "$bad" == "400" ]] || exit 1

          # Public SEO configuration remains crawlable and self-consistent.
          sitemap=$(html "sitemap.xml")
          robots=$(html "robots.txt")
          grep -q 'https://vorvan.co.in/partners.html' <<< "$sitemap" || exit 1
          grep -q 'Sitemap: https://vorvan.co.in/sitemap.xml' <<< "$robots" || exit 1
          echo "PASS: live educational website, company disclosures, contextual Vyn, separated MFA Admin, private APIs and SEO."

      - name: Verify published registered-company copy and live public demo entry points
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://vorvan.co.in"
          ready=0
          for attempt in $(seq 1 24); do
            home=$(curl --fail --location --silent --show-error --max-time 20 "$BASE/?release=20261111" || true)
            passport=$(curl --fail --location --silent --show-error --max-time 20 "$BASE/readiness-passport.html?release=20261111" || true)
            if grep -Fq 'id="product-previews"' <<< "$home" &&
               grep -Fq 'VORVAN PRIVATE LIMITED · REGISTERED COMPANY' <<< "$home" &&
               grep -Fq 'assets/readiness-passport.js?v=20261111-registered-company' <<< "$passport" &&
               ! grep -Fq 'A proposed fintech initiative' <<< "$home"; then
              ready=1
              break
            fi
            echo "Waiting for public Pages release content ($attempt/24)"
            sleep 5
          done
          [[ "$ready" == "1" ]] || { echo "FAIL: published registered company homepage/passport not observed";exit 1; }
          for asset in "experience.html" "readiness-passport.html" "vyn-coach-sandbox.html" \
            "admin.html" "assets/readiness-passport.js?v=20261111-registered-company" \
            "assets/admin.js?v=20261112-customer-enquiries"; do
            status=$(curl --location --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "$BASE/$asset")
            [[ "$status" == "200" ]] || { echo "$asset returned HTTP $status";exit 1; }
          done
          js_ready=0
          for attempt in $(seq 1 24); do
            dynamic=$(curl --fail --location --silent --show-error --max-time 20 "$BASE/assets/readiness-passport.js?v=20261112-check-$attempt" || true)
            admin_js=$(curl --fail --location --silent --show-error --max-time 20 "$BASE/assets/admin.js?v=20261112-check-$attempt" || true)
            if grep -Fq 'VORVAN PRIVATE LIMITED is registered' <<< "$dynamic" &&
               grep -Fq 'নিবন্ধিত কোম্পানি' <<< "$dynamic" &&
               grep -Fq 'पंजीकृत कंपनी' <<< "$dynamic" &&
               ! grep -Eqi 'pre-incorporation|incorporation pending|registration pending' <<< "$dynamic" &&
               grep -Fq 'COI evidence pending vault verification' <<< "$admin_js" &&
               grep -Fq 'incorporation_required:' <<< "$admin_js" &&
               ! grep -Eqi 'pre-incorporation|incorporation pending' <<< "$admin_js"; then
              js_ready=1;break
            fi
            echo "Waiting for refreshed company disclosure scripts ($attempt/24)"
            sleep 5
          done
          [[ "$js_ready" == "1" ]] || { echo "Updated Admin/Passport script content not observed";exit 1; }
          echo 'PASS: live company registration wording, three public demos, MFA Admin and regulated-service gates'

      - name: Confirm customer-first login page, contact-only intake and confidential enquiry gateway
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://vorvan.co.in"
          API="https://kukfpsqujlutlgwndplh.supabase.co/functions/v1/customer-operations"
          ready=0
          for attempt in $(seq 1 24); do
            home=$(curl --fail --silent --show-error --max-time 20 "$BASE/?customer=20261112" || true)
            page=$(curl --fail --silent --show-error --max-time 20 "$BASE/customer.html?customer=20261112" || true)
            if grep -Fq 'href="customer.html"' <<< "$home" &&
               grep -Fq 'CIBIL EDUCATION' <<< "$home" &&
               grep -Fq 'assets/customer-portal.js?v=20261111-customer-v1' <<< "$page"; then
              ready=1;break
            fi
            echo "Customer publication pending ($attempt/24)"
            sleep 5
          done
          [[ "$ready" == "1" ]] || { echo "Customer login page was not published";exit 1; }
          grep -Fq 'name="robots" content="noindex,follow"' <<< "$page"
          grep -Fq 'VORVAN PRIVATE LIMITED' <<< "$page"
          grep -Fq 'No Aadhaar, PAN' <<< "$page"
          for asset in "assets/customer-portal.js?v=20261111-customer-v1" \
            "assets/customer-journey-engine.js" "assets/customer-portal.css?v=20261111-customer-v1" \
            "assets/customer-admin-queue.js" "assets/admin.js?v=20261112-customer-enquiries"; do
            code=$(curl --location --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "$BASE/$asset")
            [[ "$code" == "200" ]] || { echo "$asset HTTP $code";exit 1; }
          done
          client=$(curl --fail --location --silent --show-error --max-time 20 "$BASE/assets/customer-portal.js?v=20261111-customer-v1")
          grep -Fq 'vorvan_customer_intake_profiles' <<< "$client"
          grep -Fq 'vorvan_customer_enquiries' <<< "$client"
          grep -Fq 'fictional' <<< "$client"
          status=$(curl --location --silent --show-error --max-time 20 \
            -o /dev/null -w '%{http_code}' "$API/enquiries")
          [[ "$status" == "401" ]] || { echo "Customer owner-only Admin gateway exposed or unavailable: HTTP $status";exit 1; }
          echo "PASS: customer login and secure enquiry frontend published, Owner AAL2 endpoint anonymous 401; actual OTP delivery still needs human UAT"
