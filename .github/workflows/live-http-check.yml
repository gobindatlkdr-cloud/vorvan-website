name: Live website URL verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check current live public site, routing and protected APIs
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://vorvan.co.in/"
          EDGE="https://kukfpsqujlutlgwndplh.supabase.co/functions/v1"
          html() { curl --fail --location --silent --show-error --max-time 25 "$BASE$1"; }
          code() { curl --location --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "$1"; }

          # GitHub Pages can publish shortly after main CI starts.
          site_ready=0
          for attempt in $(seq 1 12); do
            home=$(html "" || true)
            if grep -q 'id="loan-categories"' <<< "$home" &&
               grep -q 'Partner With Us' <<< "$home" &&
               grep -q 'Registered company (owner-confirmed)' <<< "$home" &&
               ! grep -q 'Incorporation pending' <<< "$home"; then
              site_ready=1;break
            fi
            echo "Waiting for current live website release ($attempt/12)"
            sleep 5
          done
          [[ "$site_ready" == "1" ]] || { echo "FAIL: updated public homepage not live"; exit 1; }

          # Required user-facing and protected web assets.
          for path in assets/site.css assets/site.js assets/assistant.js assets/refresh.css assets/favicon.svg \
            assets/partner-portal.css assets/institutional-inquiry.js assets/institutional-inquiry.css \
            index.html solutions.html partners.html partner-desk.html experience.html \
            about.html contact.html privacy.html terms.html admin.html assets/admin.js assets/admin.css \
            sitemap.xml robots.txt google7decf5ca6ffe0331.html; do
            status=$(code "$BASE$path")
            echo "$path: HTTP $status"
            [[ "$status" == "200" ]] || exit 1
          done

          # The four categories must remain educational; company registration is not lending authorisation.
          solutions=$(html "solutions.html")
          for category in 'Personal Loan' 'Business Loan' 'Education Loan' 'Short-Term Loan'; do
            grep -q "$category" <<< "$home" || exit 1
            grep -q "$category" <<< "$solutions" || exit 1
          done
          grep -q 'No live loan, credit-bureau, KYC or payment services' <<< "$home" || exit 1
          grep -q 'class="vv-vyn-antenna-rotor"' <<< "$home" || exit 1
          grep -q 'data-vv-search-submit' <<< "$home" || exit 1

          # Contact paths are scoped: no internal Admin mailbox on public pages.
          contact=$(html "contact.html")
          partners=$(html "partners.html")
          privacy=$(html "privacy.html")
          grep -q 'info@vorvan.co.in' <<< "$contact" || exit 1
          grep -q 'support@vorvan.co.in' <<< "$contact" || exit 1
          grep -q 'partnerships@vorvan.co.in' <<< "$partners" || exit 1
          grep -q 'legal@vorvan.co.in' <<< "$privacy" || exit 1
          grep -q 'id="vv-institutional-inquiry-form"' <<< "$partners" || exit 1
          for page in "$home" "$contact" "$partners" "$privacy"; do
            if grep -q 'admin@vorvan.co.in' <<< "$page"; then
              echo "FAIL: internal Admin mailbox exposed on public page";exit 1
            fi
          done

          # Private staff route remains separate and cannot serve operations without a session.
          admin=$(html "admin.html")
          grep -q 'id="mfa-form"' <<< "$admin" || exit 1
          grep -q 'id="panel-nav"' <<< "$admin" || exit 1
          for url in "$EDGE/compliance-vault/" "$EDGE/admin-console/overview" "$EDGE/ai-guidance"; do
            status=$(code "$url")
            echo "Protected route $url HTTP $status"
            [[ "$status" == "401" ]] || exit 1
          done

          # Public Vyn response: correct institutional contact, no internal details.
          for lang in en bn hi; do
            response=$(curl --fail --silent --show-error --max-time 25 -X POST \
              -H 'Content-Type: application/json' -H 'Origin: https://vorvan.co.in' \
              -d "{\"language\":\"$lang\",\"topic\":\"contact\"}" "$EDGE/site-assistant")
            grep -q '"official_email":"info@vorvan.co.in"' <<< "$response" || exit 1
            if grep -q 'admin@vorvan.co.in\|official_emails' <<< "$response"; then
              echo "FAIL: Vyn leaked internal contact data";exit 1
            fi
          done
          p_response=$(curl --fail --silent --show-error --max-time 25 -X POST \
            -H 'Content-Type: application/json' -H 'Origin: https://vorvan.co.in' \
            -d '{"language":"en","topic":"partnership"}' "$EDGE/site-assistant")
          grep -q '"official_email":"partnerships@vorvan.co.in"' <<< "$p_response" || exit 1

          # Institutional intake rejects public reads and malformed submission.
          [[ "$(code "$EDGE/institutional-inquiries")" == "401" ]] || exit 1
          bad=$(curl --silent --show-error --max-time 20 -X POST \
            -H 'Origin: https://vorvan.co.in' -H 'Content-Type: application/json' \
            -d '{"institution_type":"nbfc","consent":false}' -o /dev/null -w '%{http_code}' "$EDGE/institutional-inquiries")
          [[ "$bad" == "400" ]] || exit 1

          # Public SEO configuration remains crawlable and self-consistent.
          sitemap=$(html "sitemap.xml")
          robots=$(html "robots.txt")
          grep -q 'https://vorvan.co.in/partners.html' <<< "$sitemap" || exit 1
          grep -q 'Sitemap: https://vorvan.co.in/sitemap.xml' <<< "$robots" || exit 1
          echo "PASS: live educational website, company disclosures, contextual Vyn, separated MFA Admin, private APIs and SEO."
